<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Websoft9</title>
    <style>
        :root {
            color: #172033;
            background: #f4f7fb;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
        }

        main {
            display: grid;
            justify-items: center;
            gap: 18px;
            padding: 32px;
            text-align: center;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #c9d8ef;
            border-top-color: #1767d1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .status-icon {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
        }

        .warning-icon {
            display: none;
            box-sizing: border-box;
            width: 32px;
            height: 32px;
            border: 2px solid #c66b13;
            border-radius: 50%;
            color: #c66b13;
            font-family: Arial, sans-serif;
            font-size: 22px;
            font-weight: 700;
            line-height: 28px;
            text-align: center;
        }

        main.is-unavailable .spinner {
            display: none;
        }

        main.is-unavailable .warning-icon {
            display: block;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }

        p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }

        button {
            display: none;
            padding: 8px 14px;
            border: 1px solid #1767d1;
            border-radius: 4px;
            background: #1767d1;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
        }

        button.is-visible {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="status-icon" aria-hidden="true">
            <div class="spinner"></div>
            <div class="warning-icon">!</div>
        </div>
        <h1 id="status-title">Websoft9 is starting</h1>
        <p id="status-detail">This page will continue automatically when the service is ready.</p>
        <button id="retry-button" type="button">Retry now</button>
    </main>
    <script>
        const STARTING_RETRY_INTERVAL_MS = 2_000
        const RETRY_INTERVAL_MS = 5_000
        const RUNTIME_STATUS_GRACE_PERIOD_MS = 30_000
        const runtimeStatusPath = '/w9gateway/runtime-status'
        const readinessPath = window.location.pathname === '/setup'
            ? '/api/healthz/setup-ready'
            : '/api/healthz/ready'
        const statusTitle = document.getElementById('status-title')
        const statusDetail = document.getElementById('status-detail')
        const retryButton = document.getElementById('retry-button')
        const main = document.querySelector('main')
        const isChinese = navigator.language.toLowerCase().startsWith('zh')
        const startupStartedAt = Date.now()
        let retryTimer
        let isChecking = false

        const scheduleRetry = (delay = RETRY_INTERVAL_MS) => {
            window.clearTimeout(retryTimer)
            retryTimer = window.setTimeout(retry, delay)
        }
        const showStarting = () => {
            main.classList.remove('is-unavailable')
            statusTitle.textContent = isChinese ? 'Websoft9 正在启动' : 'Websoft9 is starting'
            statusDetail.textContent = isChinese
                ? '服务就绪后将自动继续。'
                : 'This page will continue automatically when the service is ready.'
        }
        const showUnavailable = () => {
            main.classList.add('is-unavailable')
            statusTitle.textContent = isChinese ? 'Websoft9 服务暂时不可用' : 'Websoft9 is temporarily unavailable'
            statusDetail.textContent = isChinese
                ? '服务可能仍在启动或暂时无法访问，恢复后将自动继续。'
                : 'The service may still be starting or is temporarily unreachable. This page will continue automatically when it recovers.'
            retryButton.textContent = isChinese ? '立即重试' : 'Retry now'
            retryButton.classList.add('is-visible')
        }
        const showMarketplaceUnavailable = () => {
            main.classList.add('is-unavailable')
            statusTitle.textContent = isChinese ? '应用商店初始化不可用' : 'Marketplace setup is unavailable'
            statusDetail.textContent = isChinese
                ? '应用商店更新失败，且没有可用的应用目录。'
                : 'The Appstore update failed and no usable catalog is available.'
            retryButton.textContent = isChinese ? '立即重试' : 'Retry now'
            retryButton.classList.add('is-visible')
        }
        const getRuntimeState = () => fetch(runtimeStatusPath, { cache: 'no-store' })
            .then((response) => response.ok ? response.json() : null)
            .then((payload) => typeof payload?.state === 'string' ? payload.state : null)
            .catch(() => null)
        const retry = () => {
            if (isChecking) return
            isChecking = true
            getRuntimeState()
                .then((runtimeState) => {
                    const isWithinRuntimeStatusGracePeriod = Date.now() - startupStartedAt < RUNTIME_STATUS_GRACE_PERIOD_MS
                    if (runtimeState === 'starting' || (runtimeState === null && isWithinRuntimeStatusGracePeriod)) {
                        showStarting()
                        scheduleRetry(STARTING_RETRY_INTERVAL_MS)
                        return null
                    }
                    if (runtimeState === 'failed' || runtimeState === null) {
                        showUnavailable()
                    }
                    return fetch(readinessPath, { credentials: 'include', cache: 'no-store' })
                })
                .then((response) => {
                    if (!response) return
                    if (response.ok) window.location.reload()
                    else return response.json().catch(() => ({})).then((payload) => {
                        if (payload.pending && payload.pending.includes('appstore-sync-failed')) {
                            showMarketplaceUnavailable()
                        } else {
                            showUnavailable()
                        }
                        scheduleRetry()
                    })
                })
                .catch(() => {
                    showUnavailable()
                    scheduleRetry()
                })
                .finally(() => {
                    isChecking = false
                })
        }
        retryButton.addEventListener('click', () => {
            window.clearTimeout(retryTimer)
            window.location.reload()
        })
        showStarting()
        retry()
    </script>
</body>

</html>
