name: Dev Candidate Publish

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to publish as a dev candidate
        required: false
        default: dev
        type: string
  push:
    branches: [dev]
    paths-ignore:
      - 'docs/**'
      - 'media/**'
      - 'logs/**'
      - '.gitignore'
      - 'LICENSE*'
      - 'README.md'

concurrency:
  group: dev-publish-${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── Detect what changed to skip unnecessary image builds ──
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
      install: ${{ steps.filter.outputs.install }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - '.github/workflows/dev-publish.yml'
              - '.github/workflows/docker-build.yml'
              - '.github/workflows/smoke-test.yml'
              - 'docker/Dockerfile'
              - 'docker/proxy/**'
              - 'docker/gateway/**'
              - 'docker/apphub/**'
              - 'docker/scripts/**'
              - 'docker/supervisord.conf'
              - 'docker/crontab'
              - 'docker/deployment/**'
              - 'console/**'
              - 'apphub/**'
              - 'version.json'
            install:
              - 'install/**'
              - 'scripts/**'
              - 'mirrors.json'
              - 'CHANGELOG.md'
              - 'docker/docker-compose.yml'
              - 'docker/docker-compose.dev.yml'

  # ── Determine dev candidate tags ──
  meta:
    name: Determine Build Meta
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      candidate_tag: ${{ steps.meta.outputs.candidate_tag }}
      version: ${{ steps.meta.outputs.version }}
      alias_tags: ${{ steps.meta.outputs.alias_tags }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - id: meta
        run: |
          VERSION=$(jq -r '.version' version.json)
          SOURCE_REF=$(git rev-parse HEAD)
          SHA_TAG="sha-${SOURCE_REF:0:8}"

          CHANNEL=dev
          CANDIDATE_TAG="websoft9dev/websoft9:${SHA_TAG}"
          ALIAS_TAGS="websoft9dev/websoft9:dev,websoft9dev/websoft9:${VERSION}-dev"
          TAGS="$CANDIDATE_TAG"

          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "candidate_tag=$CANDIDATE_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "alias_tags=$ALIAS_TAGS" >> $GITHUB_OUTPUT
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT
          echo "source_ref=$SOURCE_REF" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

          echo "✅ Dev candidate | Ref: $SOURCE_REF | Version: $VERSION | SHA: $SHA_TAG"

  # ── Build, scan, push dev image ──
  build-and-push:
    name: Build & Push Image
    needs: [meta, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/docker-build.yml
    with:
      push: true
      platforms: linux/amd64
      tags: ${{ needs.meta.outputs.tags }}
      appstore_channel: ${{ needs.meta.outputs.channel }}
      no_cache: true
    secrets: inherit

  # ── Smoke test the immutable ECR Public candidate ──
  smoke-test:
    name: Smoke Test
    needs: [meta, changes, build-and-push]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/smoke-test.yml
    with:
      image: public.ecr.aws/w6g2g5k1/websoft9:${{ needs.meta.outputs.sha_tag }}

  # ── Promote tested candidate to moving dev aliases ──
  promote-tags:
    name: Promote Dev Tags
    needs: [meta, changes, build-and-push, smoke-test]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Promote candidate to dev aliases
        run: |
          SOURCE_IMAGE="${{ needs.meta.outputs.candidate_tag }}"
          IFS=',' read -ra TARGETS <<< "${{ needs.meta.outputs.alias_tags }}"
          for target in "${TARGETS[@]}"; do
            echo "Promoting $SOURCE_IMAGE -> $target"
            docker buildx imagetools create -t "$target" "$SOURCE_IMAGE"
          done

      - name: Promote Amazon ECR Public dev aliases
        run: |
          ECR_REPOSITORY="public.ecr.aws/w6g2g5k1/websoft9"
          SOURCE_IMAGE="${ECR_REPOSITORY}:${{ needs.meta.outputs.sha_tag }}"
          IFS=',' read -ra TARGETS <<< "${{ needs.meta.outputs.alias_tags }}"
          for target in "${TARGETS[@]}"; do
            target_tag="${target##*:}"
            echo "Promoting $SOURCE_IMAGE -> ${ECR_REPOSITORY}:${target_tag}"
            docker buildx imagetools create -t "${ECR_REPOSITORY}:${target_tag}" "$SOURCE_IMAGE"
          done

      - name: Remove Amazon ECR Public candidate tag
        run: |
          aws ecr-public batch-delete-image \
            --repository-name websoft9 \
            --image-ids imageTag="${{ needs.meta.outputs.sha_tag }}" \
            --region us-east-1

  cleanup-ecr-orphans:
    name: Clean ECR Public Orphans
    needs: [changes, build-and-push, smoke-test, promote-tags]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/ecr-cleanup.yml
    secrets: inherit

  # ── Publish dev artifacts to R2 without creating a formal release ──
  upload-artifacts:
    name: Upload Dev Artifacts
    needs: [meta, changes, build-and-push, smoke-test, promote-tags]
    if: ${{ always() && !cancelled() && (needs.changes.outputs.install == 'true' || (needs.build-and-push.result == 'success' && needs.smoke-test.result == 'success' && needs.promote-tags.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.source_ref }}

      - name: Create dev distribution bundles
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          CHANNEL="${{ needs.meta.outputs.channel }}"
          SHA_TAG="${{ needs.meta.outputs.sha_tag }}"
          CANDIDATE_TAG="${{ needs.meta.outputs.candidate_tag }}"
          ALIAS_TAGS="${{ needs.meta.outputs.alias_tags }}"
          GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUNDLE_FILE="websoft9-${VERSION}-${SHA_TAG}.zip"

          mkdir -p release-assets r2-artifacts websoft9

          jq \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            '.version = $version | .channel = $channel' \
            version.json > staged-version.json

          cp -r docker websoft9/
          cp -r scripts websoft9/
          cp -r install websoft9/
          cp staged-version.json websoft9/version.json
          cp CHANGELOG.md websoft9/
          cp mirrors.json websoft9/
          bash scripts/prepare_platform_artifact.sh \
            --channel "$CHANNEL" \
            --bundle-docker-dir websoft9/docker \
            --artifact-dir r2-artifacts

          zip -r "$BUNDLE_FILE" websoft9
          cp "$BUNDLE_FILE" release-assets/
          cp "release-assets/${BUNDLE_FILE}" release-assets/websoft9-dev.zip
          bash install/build-bundle.sh --channel "$CHANNEL" install/dist
          cp install/dist/install.sh r2-artifacts/install.sh
          cp install/dist/uninstall.sh r2-artifacts/uninstall.sh
          cp install/install_docker.sh r2-artifacts/install_docker.sh
          cp staged-version.json r2-artifacts/version.json
          cp CHANGELOG.md r2-artifacts/CHANGELOG.md
          cp mirrors.json r2-artifacts/mirrors.json
          cp staged-version.json release-assets/version.json
          cp CHANGELOG.md release-assets/CHANGELOG.md
          cp mirrors.json release-assets/mirrors.json

          jq -n \
            --arg schema_version "1" \
            --arg product "websoft9" \
            --arg channel "$CHANNEL" \
            --arg version "$VERSION" \
            --arg git_sha "${{ needs.meta.outputs.source_ref }}" \
            --arg generated_at "$GENERATED_AT" \
            --arg repository "websoft9dev/websoft9" \
            --arg default_tag "dev" \
            --arg version_tag "${VERSION}-dev" \
            --arg candidate_tag "$CANDIDATE_TAG" \
            --arg alias_tags "$ALIAS_TAGS" \
            --arg sha_tag "$SHA_TAG" \
            '{
              schema_version: ($schema_version | tonumber),
              product: $product,
              channel: $channel,
              version: $version,
              git_sha: $git_sha,
              generated_at: $generated_at,
              install: {
                compose_file: $compose_file,
                install_script: "install.sh",
                uninstall_script: "uninstall.sh",
                docker_install_script: "install_docker.sh",
                changelog_file: "CHANGELOG.md",
                version_file: "version.json",
                mirrors_file: "mirrors.json",
                checksum_file: "SHA256SUMS"
              },
              image: {
                repository: $repository,
                default_tag: $default_tag,
                version_tag: $version_tag,
                candidate_tag: $candidate_tag,
                alias_tags: ($alias_tags | split(","))
              },
              distribution: {
                bundle_file: ("websoft9-" + $version + "-" + $sha_tag + ".zip"),
                alias_bundle_file: "websoft9-dev.zip"
              }
            }' \
            --arg compose_file "docker-compose.yml" > manifest.json

          cp manifest.json r2-artifacts/manifest.json
          cp manifest.json release-assets/manifest.json

          grep '^OPT_CHANNEL="dev"' install/dist/install.sh
          jq -e '.channel == "dev" and .install.compose_file == "docker-compose.yml"' manifest.json >/dev/null

          (
            cd r2-artifacts
            sha256sum \
              install.sh \
              uninstall.sh \
              install_docker.sh \
              docker-compose.yml \
              version.json \
              CHANGELOG.md \
              mirrors.json \
              manifest.json > SHA256SUMS
          )

          (
            cd release-assets
            sha256sum \
              "$BUNDLE_FILE" \
              websoft9-dev.zip \
              version.json \
              CHANGELOG.md \
              mirrors.json \
              manifest.json > SHA256SUMS
          )

          echo "✅ Dev bundles created: ${BUNDLE_FILE}"

      - name: Upload to Cloudflare R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.CLOUDFLARE_R2_SECRET_ID }}
          r2-secret-access-key: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          r2-bucket: artifact
          source-dir: r2-artifacts
          destination-dir: ./websoft9/${{ needs.meta.outputs.channel }}

      - name: Purge Cloudflare Cache
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PURGE_URLS: >-
            ["https://artifact.websoft9.com/websoft9/${{ needs.meta.outputs.channel }}/install.sh",
            "https://artifact.websoft9.com/websoft9/${{ needs.meta.outputs.channel }}/uninstall.sh",
            "https://artifact.websoft9.com/websoft9/${{ needs.meta.outputs.channel }}/install_docker.sh",
            "https://artifact.websoft9.com/websoft9/${{ needs.meta.outputs.channel }}/docker-compose.yml",
            "https://artifact.websoft9.com/websoft9/${{ needs.meta.outputs.channel }}/manifest.json",
            "https://artifact.websoft9.com/websoft9/${{ needs.meta.outputs.channel }}/version.json",
            "https://artifact.websoft9.com/websoft9/${{ needs.meta.outputs.channel }}/SHA256SUMS"]

      - name: Publish Dev GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-artifacts
          target_commitish: ${{ needs.meta.outputs.source_ref }}
          name: Dev Artifacts
          prerelease: true
          draft: false
          generate_release_notes: false
          make_latest: false
          files: |
            release-assets/websoft9-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.sha_tag }}.zip
            release-assets/websoft9-dev.zip
            release-assets/manifest.json
            release-assets/SHA256SUMS
            release-assets/version.json
            release-assets/CHANGELOG.md
