name: Secret History Audit

on:
  schedule:
    - cron: '35 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-audit:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan branch history
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            git --redact=100 --log-opts="--all" /repo